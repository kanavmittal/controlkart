name: Build & Deploy

# Builds Docker images in CI and pushes them to GHCR, then tells Dokploy to pull
# & redeploy. The VPS never builds — it only pulls finished images (no more
# build-OOM taking down the panel). Each app rebuilds only when its files change.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build & deploy both apps regardless of changed paths"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: kanavmittal # GHCR namespace (must be lowercase)
  MEDUSA_APP_ID: ${{ vars.MEDUSA_APP_ID }}
  STOREFRONT_APP_ID: ${{ vars.STOREFRONT_APP_ID }}
  # NEXT_PUBLIC_* are inlined into the storefront bundle at build time (public values).
  NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.controlkart.com
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_BASE_URL: https://controlkart.com

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @controlkart/storefront lint
      - run: pnpm --filter @controlkart/storefront test
      - run: pnpm --filter @controlkart/medusa test:unit
      - run: node scripts/audit-production.cjs

  changes:
    runs-on: ubuntu-latest
    outputs:
      medusa: ${{ steps.f.outputs.medusa }}
      storefront: ${{ steps.f.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            medusa:
              - 'apps/medusa/**'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy.yml'
            storefront:
              - 'apps/storefront/**'
              - 'pnpm-lock.yaml'
              - 'patches/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy.yml'

  medusa:
    needs: [changes, quality]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.medusa == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/medusa/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/controlkart-medusa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy (medusa)
        if: ${{ vars.DOKPLOY_DEPLOY_ENABLED == 'true' }}
        env:
          APPLICATION_ID: ${{ env.MEDUSA_APP_ID }}
          DOCKER_IMAGE: ghcr.io/kanavmittal/controlkart-medusa:${{ github.sha }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/deploy-dokploy.sh

  storefront:
    needs: [changes, quality]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.storefront == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ env.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/controlkart-storefront:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy (storefront)
        if: ${{ vars.DOKPLOY_DEPLOY_ENABLED == 'true' }}
        env:
          APPLICATION_ID: ${{ env.STOREFRONT_APP_ID }}
          DOCKER_IMAGE: ghcr.io/kanavmittal/controlkart-storefront:${{ github.sha }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/deploy-dokploy.sh
